# CI gate (HANDOFF_repo_health.md F7): the repo had no lint step at all.
# The ruff gate is error-class only (E9 syntax + F pyflakes) — the style
# classes are deliberately out of scope for now; see pyproject [tool.ruff].
# (The frontend has its own repo, phytospectra/phyto-companion-frontend;
# frontend/ here is a local working copy and is git-ignored.)
name: CI

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2" pytest fastapi uvicorn httpx "stripe>=9.0" \
            rdkit numpy scipy pandas networkx scikit-learn matplotlib python-docx ruff

      - name: Stage auth package
        run: make stage-auth

      - name: Lint (ruff error-class gate)
        run: make lint

      - name: Run test suite (dry-run plane)
        env:
          PHYTO_ENV: local
        run: make test

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks (MIT v8 release line)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Secret scan (tree, project allowlist)
        run: gitleaks detect --source . --no-git --config .gitleaks.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2" pytest fastapi uvicorn httpx "stripe>=9.0" \
            rdkit numpy scipy pandas networkx scikit-learn matplotlib python-docx ruff pip-audit

      - name: Dependency audit (pip-audit)
        run: pip-audit
