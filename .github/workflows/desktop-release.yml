# Build Phytospectra Desktop installers for macOS and Windows.
# Triggered by version tags (desktop-v*) or manually; artifacts attach to
# the workflow run and, when GOOGLE_APPLICATION_CREDENTIALS_JSON is set,
# the installers are published to gs://phytospectra-downloads/downloads/.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx numpy scipy matplotlib
      - name: Build app bundle
        run: scripts/build_desktop.sh
      - name: Wrap into .app and zip
        run: |
          cd desktop/dist
          APP=Phytospectra.app
          mkdir -p "$APP/Contents/MacOS"
          cp -R Phytospectra/Phytospectra "$APP/Contents/MacOS/"
          cp -R Phytospectra/_internal "$APP/Contents/MacOS/_internal"
          chmod +x "$APP/Contents/MacOS/Phytospectra"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Phytospectra</string>
            <key>CFBundleDisplayName</key><string>Phytospectra</string>
            <key>CFBundleExecutable</key><string>Phytospectra</string>
            <key>CFBundleIdentifier</key><string>com.phytospectra.desktop</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          ditto -c -k --keepParent "$APP" Phytospectra-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Phytospectra-macos
          path: desktop/dist/Phytospectra-macos.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx numpy scipy matplotlib
      - name: Build exe
        shell: bash
        run: scripts/build_desktop.sh --onefile
      - uses: actions/upload-artifact@v4
        with:
          name: Phytospectra-windows
          path: desktop/dist/Phytospectra.exe

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts
        run: |
          cp artifacts/Phytospectra-macos/Phytospectra-macos.zip .
          cp artifacts/Phytospectra-windows/Phytospectra.exe Phytospectra-windows.exe
          sha256sum Phytospectra-macos.zip Phytospectra-windows.exe > SHA256SUMS.txt
      - name: Publish to GCS download bucket
        env:
          GCP_SA_JSON: ${{ secrets.GCS_DOWNLOADS_SA_JSON }}
        run: |
          pip install --quiet google-cloud-storage
          python scripts/publish_downloads.py
        continue-on-error: true