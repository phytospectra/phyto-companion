[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-llm"
version = "0.1.0"
description = "PhytoCompanion LLM service: grounded Tier-3 generation over retrieved literature"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # OpenRouter is a plain HTTP API; httpx keeps the client testable through
    # MockTransport without pulling in a vendor SDK.
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
# Vertex AI SDK is cloud-plane only; the local plane must never need it.
vertex = ["google-cloud-aiplatform>=1.60"]
