[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-auth"
version = "0.1.0"
description = "PhytoCompanion auth service: Firebase identity verification and synchronous token reservation"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "firebase-admin>=6.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
