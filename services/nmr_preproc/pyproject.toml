[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-nmr-preproc"
version = "0.1.0"
description = "PhytoCompanion NMR preprocessing service (ADR-0068)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
