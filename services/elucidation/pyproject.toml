[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-elucidation"
version = "0.1.0"
description = "PhytoCompanion elucidation service: shift prediction, matching, ranking, novel structures"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.11",
    "rdkit>=2024.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
