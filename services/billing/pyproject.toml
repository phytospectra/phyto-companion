[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-billing"
version = "0.1.0"
description = "PhytoCompanion billing worker: asynchronous usage audit, Pub/Sub consumer, Stripe top-up"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-cloud-pubsub>=2.21",
    "google-cloud-firestore>=2.16",
    "stripe>=9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
