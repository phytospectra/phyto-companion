[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-literature"
version = "0.1.0"
description = "PhytoCompanion literature service: PubMed, Semantic Scholar and OpenAlex retrieval with deduplication and BM25 ranking"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
