[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-nmr-search"
version = "0.1.0"
description = "PhytoCompanion NMR structure-search service: NP-MRD, BMRB and nmrshiftdb2 peak-list lookup with licence metadata"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
