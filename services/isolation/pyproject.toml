[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-isolation"
version = "0.1.0"
description = "PhytoCompanion isolation service: structured bench fractionation, TLC and yield records as ranking priors (ADR-0055)"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "phyto-companion-auth>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "google-cloud-firestore>=2.11; platform_system != 'Windows'",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]