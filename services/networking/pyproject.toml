[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-networking"
version = "0.1.0"
description = "PhytoCompanion networking service: GNPS MS2, HSQC, and fused molecular networks"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "phyto-companion-shared>=0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
