[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phyto-companion-shared"
version = "0.1.0"
description = "Shared domain models, provenance, and uncertainty utilities for PhytoCompanion"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "pydantic>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["phyto_shared"]
